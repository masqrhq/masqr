name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # uploading release assets

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,      goos: linux,   goarch: amd64, ext: ''     }
          - { runner: ubuntu-22.04-arm,   goos: linux,   goarch: arm64, ext: ''     }
          - { runner: macos-latest,       goos: darwin,  goarch: arm64, ext: ''     }
          - { runner: windows-latest,     goos: windows, goarch: amd64, ext: '.exe' }
          # windows/arm64 is omitted: its runner has no native CGO toolchain
          # (gcc is x86_64 mingw). Windows-on-ARM runs the amd64 build under x64
          # emulation. Revisit if a native arm64 artifact is needed.
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify LFS payloads
        shell: bash
        run: |
          # A stubbed .onnx (still an LFS pointer, ~130 bytes) would get baked
          # into the binary by go:embed and OCR would fail silently at runtime.
          # Catch it here so a broken artifact never reaches a release.
          for f in .ocr/det.onnx .ocr/rec.onnx .ocr/cls.onnx; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 100000 ]; then
              echo "::error::$f is only $size bytes — LFS payload not pulled."
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          out="dist/masqr-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "$out" .
          ls -lh "$out"
          # Ship the bare binary — no tar/zip. The sha256 sits next to it.
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: Generate sha256
        shell: bash
        run: |
          asset="${{ env.ASSET }}"
          dir=$(dirname "$asset"); base=$(basename "$asset")
          # Checksum the basename so `sha256sum -c` works where the file lands.
          ( cd "$dir" && { command -v sha256sum >/dev/null 2>&1 \
              && sha256sum "$base" || shasum -a 256 "$base"; } > "${base}.sha256" )
          cat "${asset}.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          fail_on_unmatched_files: true
          # Static body, identical across every matrix job, so the release notes
          # aren't duplicated — each job overwrites with the same content rather
          # than appending another generate_release_notes block (a 4-job matrix
          # with generate_release_notes produced four stacked changelogs).
          body: |
            masqr **${{ github.ref_name }}** — see the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for what's included.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          # Hyphenated tags (v1.2.3-rc1, -beta…) are prereleases, so they never
          # supersede a real release as "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
