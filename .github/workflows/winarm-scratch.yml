# TEMPORARY scratch workflow — iterate the windows/arm64 CGO toolchain without
# burning release tags. Delete once the working steps are folded into release.yml.
name: winarm-scratch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  winarm:
    runs-on: windows-11-arm
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install llvm-mingw (aarch64 toolchain)
        shell: pwsh
        run: |
          $json = Invoke-RestMethod https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest
          $asset = $json.assets | Where-Object { $_.name -match 'ucrt-aarch64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "no ucrt-aarch64 asset in latest llvm-mingw release" }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath "$HOME\llvm" -Force
          $dir = Get-ChildItem "$HOME\llvm" -Directory | Where-Object { $_.Name -like 'llvm-mingw-*' } | Select-Object -First 1
          "$($dir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build windows/arm64 (CGO)
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: arm64
          CC: aarch64-w64-mingw32-clang
        run: |
          set -euo pipefail
          which "$CC"
          "$CC" --version
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/masqr-test-windows-arm64.exe" .
          ls -lh "dist/masqr-test-windows-arm64.exe"

      # Mirror release.yml's staging with the path-collision fix (stage under
      # dist/stage/ so it can't clash with the binary) + 7z, to prove both work
      # on the windows-11-arm runner before touching release.yml.
      - name: Stage + zip (release-parity smoke)
        shell: bash
        run: |
          set -euo pipefail
          stem="masqr-test-windows-arm64"
          staging="dist/stage/${stem}"
          mkdir -p "$staging"
          cp "dist/${stem}.exe" "$staging/masqr.exe"
          cp LICENSE NOTICE README.md "$staging/"
          cp -r LICENSES "$staging/"
          (cd dist/stage && 7z a "../${stem}.zip" "${stem}/")
          ls -lh "dist/${stem}.zip"
