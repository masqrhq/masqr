<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="masqr — deep prompt inspection">
  <title>masqr — deep prompt inspection</title>

  <rect x="0" y="0" width="1200" height="360" rx="16" fill="#FAFAFA"/>
  <rect x="0" y="0" width="1200" height="360" rx="16" fill="none" stroke="#E8E8EB" stroke-width="1"/>

  <!-- magnifier-q lens (the brand mark) -->
  <g transform="translate(70, 70)">
    <circle cx="104" cy="104" r="78" fill="none" stroke="#1E1E24" stroke-width="18"/>
    <line x1="160" y1="160" x2="232" y2="232" stroke="#1E1E24" stroke-width="20" stroke-linecap="round"/>
    <rect x="62" y="72"  width="74"  height="14" rx="7" fill="#1E1E24"/>
    <rect x="46" y="97"  width="102" height="14" rx="7" fill="#E55A3C"/>
    <rect x="62" y="122" width="58"  height="14" rx="7" fill="#1E1E24"/>
  </g>

  <!-- wordmark + accent + taglines -->
  <text x="380" y="170"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="128" font-weight="800" fill="#1E1E24" letter-spacing="-4">masqr</text>

  <rect x="386" y="194" width="240" height="8" rx="4" fill="#E55A3C"/>

  <text x="386" y="246"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="600" fill="#1E1E24">deep prompt inspection</text>

  <text x="386" y="284"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" fill="#6B6B74">transparent HTTP proxy for LLM CLIs · scans secrets, PII &amp; attachments</text>

  <text x="386" y="320"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace"
        font-size="18" font-weight="500" fill="#9B9BA4">$ masqr claude</text>
</svg>
